}

.nav button[aria-current="page"] { color: var(--ink); font-weight: 700; }

.sucesso { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 8px 0 4px; }

.escolha-status { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

  // ---------- ações ----------
  document.addEventListener("click", function (ev) {
    var alvo = ev.target.closest("[data-acao]"); if (!alvo) return;
    var a = alvo.getAttribute("data-acao"), r = ui.rascunho;
    if (a === "fechar-folha-fundo") { if (ev.target === alvo) { ui.folha = false; render(); } return; }
    if (a === "ir") ir(alvo.getAttribute("data-tela"));
    else if (a === "filtro") { ui.filtro = alvo.getAttribute("data-valor"); render(); }
    else if (a === "novo") { ui.rascunho = novoRascunho(); ir("editor"); }
    else if (a === "abrir") { ui.abertoId = alvo.getAttribute("data-id"); ir("detalhe"); }
    else if (a === "cancelar") { var era = db.orcamentos.some(function (o) { return o.id === r.id; }); ui.rascunho = null; if (era) { ui.tela = "detalhe"; render(); } else ir("inicio"); }
    else if (a === "abrir-folha") { ui.folha = true; ui.busca = ""; render(); var b = document.getElementById("busca"); if (b && window.matchMedia("(min-width: 700px)").matches) b.focus(); }
    else if (a === "fechar-folha") { ui.folha = false; render(); }
    else if (a === "cat-filtro") { ui.catFiltro = alvo.getAttribute("data-valor"); render(); }
    else if (a === "cat-qtd") {
      var s = db.catalogo.filter(function (x) { return x.id === alvo.getAttribute("data-id"); })[0], d = +alvo.getAttribute("data-d"), idx = -1;
      r.itens.forEach(function (it, i) { if (it.catId === s.id) idx = i; });
      if (idx < 0 && d > 0) r.itens.push({ tipo: "servico", catId: s.id, nome: s.nome, qtd: 1, preco: s.preco, un: s.un || "" });
      else if (idx >= 0) { r.itens[idx].qtd += d; if (r.itens[idx].qtd <= 0) r.itens.splice(idx, 1); }
      ordenarItens(r); render();
    }
    else if (a === "qtd") { var it = r.itens[+alvo.getAttribute("data-idx")]; it.qtd = Math.max(1, it.qtd + (+alvo.getAttribute("data-d"))); render(); }
    else if (a === "tirar-item") { r.itens.splice(+alvo.getAttribute("data-idx"), 1); render(); }
    else if (a === "add-material") {
      var n = document.getElementById("mat-nome"), q = document.getElementById("mat-qtd"), p = document.getElementById("mat-preco");
      if (!n.value.trim()) { aviso("Escreva o nome do material"); n.focus(); return; }
      r.itens.push({ tipo: "material", nome: n.value.trim(), qtd: Math.max(1, parseInt(q.value, 10) || 1), preco: lerDinheiro(p.value) });

      if (pos >= 0) { db.orcamentos[pos] = r; ui.recemFeito = false; }
      else { db.orcamentos.push(r); db.proxNum = Math.max(db.proxNum, r.num + 1); ui.recemFeito = true; }
      salvar(); ui.abertoId = r.id; ui.rascunho = null; ui.tela = "detalhe"; render(); window.scrollTo(0, 0);

      ui.rascunho = c; ir("editor"); aviso("Copiado. Troque o cliente e ajuste o que precisar.");
    }

      var txt = mensagem(aberto());

      catch (e) { aviso("Não deu para copiar aqui. Use Enviar no WhatsApp."); }
